name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip check
      - name: Fetch and verify the pinned tokenizer
        run: python -B scripts/fetch_chunk_tokenizer.py
      - name: Run free tests
        run: |
          python -B - <<'PY'
          import unittest

          model_only = {
              "test_retrieval.ActualBGETests.test_cls_normalized_eval_exact_cosine",
              "test_retrieval.ActualBGETests.test_tokens_include_instruction_and_specials_no_truncation",
          }
          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          allowed_skips = {test.id() for test, reason in result.skipped
                           if reason == "Pinned model not downloaded"}
          if allowed_skips != model_only or len(result.skipped) != len(model_only):
              raise SystemExit("Unexpected test skips or missing expected BGE exclusions")
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY
      - name: Build Docker image
        run: docker build --tag aerodoc:ci .
